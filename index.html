<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#17151d">
  <title>弹壳地牢 · Dungeon Dodge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell">
    <canvas id="game" tabindex="0" aria-label="弹壳地牢游戏画面"></canvas>

    <button id="workshop-button" type="button" aria-label="打开农场与锻造工坊">农场 · 工坊</button>
    <button id="guide-button" type="button" aria-label="打开遗物图鉴">I · 道具图鉴</button>

    <section id="guide-panel" class="guide-panel" aria-hidden="true">
      <div class="guide-book">
        <header class="guide-header">
          <div>
            <div class="eyebrow">RELIC CODEX</div>
            <h2>遗物与构筑说明</h2>
          </div>
          <button id="guide-close" type="button" aria-label="关闭遗物图鉴">关闭 ×</button>
        </header>
        <div id="guide-summary" class="guide-summary"></div>
        <div id="guide-items" class="guide-items"></div>
        <p class="guide-footnote">按 <b>I</b> 或 <b>Esc</b> 返回战斗；打开图鉴时游戏自动暂停。</p>
      </div>
    </section>

    <section id="workshop-panel" class="workshop-panel" aria-hidden="true">
      <div class="workshop-book">
        <header class="guide-header">
          <div>
            <div class="eyebrow">HOMESTEAD & FORGE</div>
            <h2>幽烬农场</h2>
          </div>
          <button id="workshop-close" type="button" aria-label="关闭农场与工坊">关闭 ×</button>
        </header>
        <div id="workshop-inventory" class="workshop-inventory"></div>
        <h3 class="workshop-title">种植地块</h3>
        <div id="farm-plots" class="farm-plots"></div>
        <h3 class="workshop-title">武器图纸</h3>
        <div id="forge-recipes" class="forge-recipes"></div>
        <p class="guide-footnote">击败敌人获得种子，Boss 会带来稀有图纸；种植后收获锻造材料。</p>
      </div>
    </section>

    <section id="start-screen" class="screen visible">
      <div class="screen-panel">
        <div class="sigil" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="eyebrow">A HAND-DRAWN DUNGEON</div>
        <h1>弹壳地牢</h1>
        <p class="subtitle">选择英雄与流派，沿真实章节结构下坠 11 层，挑战十一位地牢领主。</p>
        <div class="hero-select" aria-label="选择英雄">
          <button class="hero-card selected" data-hero="breaker"><b>爆破者</b><small>摧毁流</small><em>爆裂震波</em></button>
          <button class="hero-card" data-hero="gambler"><b>铸币客</b><small>硬币流</small><em>弹壳风暴</em></button>
          <button class="hero-card" data-hero="seer"><b>秘仪师</b><small>咒文流</small><em>连锁雷咒</em></button>
          <button class="hero-card" data-hero="titan"><b>囚笼巨人</b><small>泰坦流</small><em>不屈怒吼</em></button>
        </div>
        <div class="weapon-select" aria-label="选择初始武器">
          <button class="weapon-card selected" data-weapon="repeater"><b>泪火连弩</b><em>稳定连射</em></button>
          <button class="weapon-card" data-weapon="scatter"><b>霰火心脏</b><em>近距爆发</em></button>
          <button class="weapon-card" data-weapon="wisp"><b>游魂提灯</b><em>击败 1 个 Boss 解锁</em></button>
          <button class="weapon-card" data-weapon="cleaver"><b>锯齿祭刃</b><em>击败 3 个 Boss 解锁</em></button>
          <button class="weapon-card" data-weapon="seeker"><b>追魂蜂巢</b><em>在工坊锻造</em></button>
          <button class="weapon-card" data-weapon="prism"><b>星陨棱镜</b><em>在工坊锻造</em></button>
          <button class="weapon-card" data-weapon="orbit"><b>血月环刃</b><em>在工坊锻造</em></button>
        </div>
        <div class="controls-card">
          <span><b>WASD</b> 移动</span>
          <span><b>鼠标 / 方向键</b> 射击</span>
          <span><b>空格</b> 短距闪避</span>
          <span><b>Q</b> 英雄技能</span>
          <span><b>I</b> 道具图鉴</span>
        </div>
        <button id="start-button">推开地窖之门</button>
        <p id="meta-progress" class="meta-progress">远征 0 · 通关 0 · Boss 印记 0 · 最佳击杀 0</p>
        <p class="small">原创代码绘制 · 支持键鼠与手机触控</p>
      </div>
    </section>

    <section id="end-screen" class="screen">
      <div class="screen-panel end-panel">
        <div class="sigil small-sigil" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="eyebrow" id="end-kicker">RUN OVER</div>
        <h2 id="end-title">挑战结束</h2>
        <div id="end-stats"></div>
        <button id="restart-button">再次叩门</button>
      </div>
    </section>

    <div id="touch-ui" aria-hidden="true">
      <div id="stick-zone"><div id="stick-knob"></div></div>
      <button id="skill-button">技</button>
      <button id="dash-button">滚</button>
      <button id="fire-button">射击</button>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
